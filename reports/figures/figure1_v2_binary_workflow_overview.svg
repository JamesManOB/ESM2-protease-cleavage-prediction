<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sequential binary classification workflow overview</title>
  <desc id="desc">Overview of positive splitting, partition specific negative generation, ESM2 encoding, validation selection, and final held out evaluation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#243447"/>
    </marker>
    <style>
      .bg { fill: #fbfcfe; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #17202a; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #536271; }
      .step-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #17202a; }
      .step-text { font: 400 16px Arial, Helvetica, sans-serif; fill: #34495e; }
      .small-text { font: 400 14px Arial, Helvetica, sans-serif; fill: #536271; }
      .note-title { font: 700 16px Arial, Helvetica, sans-serif; fill: #17202a; }
      .note-text { font: 400 14px Arial, Helvetica, sans-serif; fill: #34495e; }
      .box { stroke: #c9d4df; stroke-width: 2; rx: 10; }
      .train { fill: #eaf4ff; stroke: #7aa9d9; }
      .valid { fill: #fff4df; stroke: #d9a441; }
      .heldout { fill: #f7edf9; stroke: #b275bd; }
      .model { fill: #eef8f3; stroke: #69a982; }
      .select { fill: #f4f6f8; stroke: #8b98a6; }
      .source { fill: #ffffff; stroke: #9bb2c6; }
      .guard { fill: #ffffff; stroke: #d0d7de; }
      .arrow { stroke: #243447; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .thin-arrow { stroke: #536271; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .divider { stroke: #d9e0e7; stroke-width: 2; stroke-dasharray: 7 8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <text class="title" x="80" y="70">Sequential Binary Classification Workflow</text>

  <rect class="box source" x="90" y="165" width="310" height="145"/>
  <text class="step-title" x="110" y="200">1. MEROPS positives</text>
  <text class="step-text" x="110" y="232">Observed protease and cleavage</text>
  <text class="step-text" x="110" y="256">site pairs are loaded first.</text>
  <text class="small-text" x="110" y="285">Protease codes are parsed into</text>
  <text class="small-text" x="110" y="307">class, family, and full code.</text>

  <rect class="box source" x="455" y="165" width="340" height="145"/>
  <text class="step-title" x="475" y="200">2. Split positives first</text>
  <text class="step-text" x="475" y="232">Unique protease codes are split</text>
  <text class="step-text" x="475" y="256">before any negatives are made.</text>
  <text class="small-text" x="475" y="285">Held out codes are excluded from</text>
  <text class="small-text" x="475" y="307">both train and validation.</text>

  <path class="arrow" d="M 386 228 L 433 228"/>

  <rect class="box train" x="170" y="395" width="380" height="170"/>
  <text class="step-title" x="200" y="440">3a. Training pairs</text>
  <text class="step-text" x="200" y="472">Training positives stay in the</text>
  <text class="step-text" x="200" y="496">training partition.</text>
  <text class="small-text" x="200" y="526">Training negatives are sampled only</text>
  <text class="small-text" x="200" y="548">from training candidate pools.</text>

  <rect class="box valid" x="650" y="395" width="380" height="170"/>
  <text class="step-title" x="680" y="440">3b. Validation pairs</text>
  <text class="step-text" x="680" y="472">Validation positives stay in the</text>
  <text class="step-text" x="680" y="496">validation partition.</text>
  <text class="small-text" x="680" y="526">Validation negatives are sampled only</text>
  <text class="small-text" x="680" y="548">from validation candidate pools.</text>

  <path class="thin-arrow" d="M 595 300 C 470 340 385 360 360 390"/>
  <path class="thin-arrow" d="M 635 300 C 740 340 820 360 840 390"/>

  <rect class="box heldout" x="1110" y="395" width="330" height="170"/>
  <text class="step-title" x="1140" y="440">Held out sets</text>
  <text class="step-text" x="1140" y="472">Singleton proteases and</text>
  <text class="step-text" x="1140" y="496">2 to 10 sample proteases.</text>
  <text class="small-text" x="1140" y="526">Kept locked until the final</text>
  <text class="small-text" x="1140" y="548">validation selected model.</text>

  <path class="thin-arrow" d="M 775 228 C 1010 230 1185 295 1265 390"/>

  <rect class="box model" x="350" y="650" width="420" height="145"/>
  <text class="step-title" x="380" y="695">4. ESM2 binary classifier</text>
  <text class="step-text" x="380" y="727">ESM2 encodes the protease and</text>
  <text class="step-text" x="380" y="751">the cleavage site separately.</text>
  <text class="small-text" x="380" y="780">The classifier predicts positive or negative.</text>

  <rect class="box select" x="850" y="650" width="360" height="145"/>
  <text class="step-title" x="880" y="695">5. Validation selection</text>
  <text class="step-text" x="880" y="727">Validation MCC selects checkpoints</text>
  <text class="step-text" x="880" y="751">and compares intermediate runs.</text>
  <text class="small-text" x="880" y="780">Held out metrics are not used here.</text>

  <rect class="box heldout" x="1280" y="650" width="240" height="145"/>
  <text class="step-title" x="1310" y="695">6. Final held out</text>
  <text class="step-text" x="1310" y="727">Run once after final</text>
  <text class="step-text" x="1310" y="751">validation selection.</text>


  <path class="arrow" d="M 390 565 C 410 610 465 630 530 648"/>
  <path class="arrow" d="M 840 565 C 780 610 710 630 630 648"/>
  <path class="arrow" d="M 772 723 L 838 723"/>
  <path class="arrow" d="M 1212 723 L 1268 723"/>
  <path class="arrow" d="M 1275 565 C 1325 600 1365 625 1385 648"/>

  <line class="divider" x1="80" y1="345" x2="1520" y2="345"/>
  <text class="small-text" x="80" y="370">Data construction happens before model training. Train and validation negatives are generated separately.</text>

</svg>
